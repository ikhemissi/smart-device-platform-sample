# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: smart-device-platform
metadata:
  template: smart-device-platform-sample

infra:
  provider: terraform
  path: infra

services:
  telemetry-decoder:
    project: ./services/telemetry-decoder
    language: java
    host: containerapp
    docker:
      path: ../Dockerfile
      context: ../..
      remoteBuild: true
      buildArgs:
        - SERVICE=telemetry-decoder

  device-simulator:
    project: ./services/device-simulator
    language: java
    host: containerapp
    docker:
      path: ../Dockerfile
      context: ../..
      remoteBuild: true
      buildArgs:
        - SERVICE=device-simulator

  device-api:
    project: ./services/device-api
    language: java
    host: containerapp
    docker:
      path: ../Dockerfile
      context: ../..
      remoteBuild: true
      buildArgs:
        - SERVICE=device-api

  provisioning-api:
    project: ./services/provisioning-api
    language: java
    host: containerapp
    docker:
      path: ../Dockerfile
      context: ../..
      remoteBuild: true
      buildArgs:
        - SERVICE=provisioning-api

  web:
    project: ./web/portal
    language: js
    host: staticwebapp
    dist: dist
    hooks:
      # Environment-specific config.json and staticwebapp.config.json (sign-in settings, API URL, CSP).
      prepackage:
        posix:
          shell: sh
          run: node scripts/write-config.mjs
          interactive: false
          continueOnError: false

hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./scripts/hooks/preprovision.sh
      interactive: false
      continueOnError: false
  postprovision:
    posix:
      shell: sh
      run: bash ./scripts/hooks/postprovision.sh
      interactive: false
      continueOnError: false
  postdeploy:
    posix:
      shell: sh
      run: bash ./scripts/hooks/postdeploy.sh
      interactive: false
      continueOnError: false
  predown:
    posix:
      shell: sh
      run: bash ./scripts/hooks/predown.sh
      interactive: false
      continueOnError: false
