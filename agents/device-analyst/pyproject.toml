[project]
name = "device-analyst"
version = "0.1.0"
description = "AI device analyst of the Smart Device Platform (M6): Microsoft Agent Framework agent over the platform API."
readme = "README.md"
authors = [
    { name = "Iheb Khemissi", email = "iheb.khemissi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agent-framework-core>=1.23",
    "agent-framework-openai>=1.17.0",
    "aiohttp>=3.14.5",
    "azure-identity>=1.27.0",
    "azure-monitor-opentelemetry>=1.8.11",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "redis-entraid>=1.2.2",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
device-analyst = "device_analyst:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "fakeredis>=2.40.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
eval = [
    "azure-ai-evaluation>=1.18.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "ASYNC", "BLE", "PIE", "FURB"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs the dev environment (model, platform API); run with -m live"]
addopts = "-m 'not live'"
