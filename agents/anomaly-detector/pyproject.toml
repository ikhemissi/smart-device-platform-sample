[project]
name = "anomaly-detector"
version = "0.1.0"
description = "Anomaly detector of the Smart Device Platform (M7): statistics select, Microsoft-Decision-1 decides, gpt-6-luna explains."
readme = "README.md"
authors = [
    { name = "Iheb Khemissi", email = "iheb.khemissi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-monitor-opentelemetry>=1.8.11",
    "httpx>=0.28.1",
    "openai>=3.41.0",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
anomaly-detector = "anomaly_detector:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "ASYNC", "BLE", "PIE", "FURB"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the dev environment (database, models); run with -m live"]
addopts = "-m 'not live'"
