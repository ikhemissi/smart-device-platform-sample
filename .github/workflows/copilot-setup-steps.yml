# Environment of the GitHub Copilot cloud agent (first generated by `openspec update` with
# githubCopilot.cloudAgent: true, then extended for this repository; OpenSpec leaves it as is). The same toolchain as CI
# (.github/workflows/ci.yml), with every dependency fetched here, before the agent's firewall applies, so that the agent
# can build and run all offline checks of AGENTS.md. No Azure access and no secrets: the agent never deploys.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The job MUST be called `copilot-setup-steps` for the Copilot coding agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/portal/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: OpenSpec CLI
        run: |
          npm install -g @fission-ai/openspec@1.14.3
          openspec --version

      - name: Maven build (dependencies and plugins, no tests)
        run: ./mvnw -B -ntp -DskipTests install
      - name: Integration test toolchain (builds the PostgreSQL test image, resolves the test plugins)
        run: ./mvnw -B -ntp -pl services/db-migrator verify -Dit.test=PrivilegesIT -Dfailsafe.failIfNoSpecifiedTests=false
      - name: Emulator images used by integration tests
        run: |
          for image in mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1 \
                       mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1 \
                       mcr.microsoft.com/azure-sql-edge:2.0.0 \
                       mcr.microsoft.com/azure-storage/azurite:3.37.0; do
            docker pull --quiet "$image"
          done
      - name: Portal dependencies and the Playwright image
        working-directory: web/portal
        run: |
          npm ci
          version="$(node -p "require('@playwright/test/package.json').version")"
          docker pull "mcr.microsoft.com/playwright:v${version}-noble"
      - name: Python dependencies (AI agent, anomaly detector)
        run: |
          (cd agents/device-analyst && uv sync --locked)
          (cd agents/anomaly-detector && uv sync --locked)
      - name: Terraform providers
        run: terraform -chdir=infra init -backend=false -input=false
