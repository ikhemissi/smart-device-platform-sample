spring:
  application:
    name: sdp-device-api
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SDP_DB_URL:jdbc:postgresql://localhost:5432/sdp?sslmode=require}
    username: ${SDP_DB_USERNAME:}
    password: ${SDP_DB_PASSWORD:}
    # Entra ID token authentication with the device API's managed identity (AZURE_CLIENT_ID).
    azure:
      passwordless-enabled: ${SDP_DB_PASSWORDLESS:true}
    hikari:
      maximum-pool-size: ${SDP_DB_POOL_SIZE:10}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# The OpenAPI document is exported at build time (openapi.json) and imported into API Management; it is not served.
springdoc:
  api-docs:
    enabled: ${SDP_OPENAPI_ENABLED:false}
    # API Management imports OpenAPI 3.0 documents.
    version: openapi_3_0
  writer-with-order-by-keys: true

sdp:
  security:
    tenant-id: ${SDP_ENTRA_TENANT_ID:}
    audiences: ${SDP_API_AUDIENCES:}
  devices:
    # A device is "reporting" when last seen within this window, "silent" otherwise.
    reporting-window: ${SDP_REPORTING_WINDOW:15m}
  history:
    retention: ${SDP_RETENTION:30d}
    partitions: ${SDP_EVENTHUB_PARTITIONS:4}
  # Site digests (M8): the job generates them; empty sites: every site.
  digest:
    enabled: ${SDP_DIGEST_ENABLED:false}
    sites: ${SDP_DIGEST_SITES:}
  cache:
    # Azure Managed Redis (Entra ID authentication); the history cache is disabled when empty.
    host: ${SDP_REDIS_HOST:}
    port: ${SDP_REDIS_PORT:10000}
