spring:
  application:
    name: sdp-alert-service
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SDP_DB_URL:jdbc:postgresql://localhost:5432/sdp?sslmode=require}
    username: ${SDP_DB_USERNAME:}
    password: ${SDP_DB_PASSWORD:}
    # Entra ID token authentication with the service's managed identity (AZURE_CLIENT_ID).
    azure:
      passwordless-enabled: ${SDP_DB_PASSWORDLESS:true}
    hikari:
      maximum-pool-size: ${SDP_DB_POOL_SIZE:10}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

sdp:
  alerting:
    servicebus:
      fully-qualified-namespace: ${SDP_SERVICEBUS_NAMESPACE:}
      topic: ${SDP_SERVICEBUS_TOPIC:measurements}
      subscription: ${SDP_SERVICEBUS_SUBSCRIPTION:alerting}
      max-concurrent-calls: 8
      prefetch: 50
      # Service Bus emulator only (local development); never used in Azure.
      connection-string: ${SDP_SERVICEBUS_EMULATOR_CONNECTION_STRING:}
    email:
      endpoint: ${SDP_EMAIL_ENDPOINT:}
      sender: ${SDP_EMAIL_SENDER:}
      time-zone: ${SDP_EMAIL_TIME_ZONE:Europe/Paris}
    portal-base-url: ${SDP_PORTAL_BASE_URL:http://localhost:5173}
    threshold-cache-ttl: 30s
    reminder-interval: 60m
    # A breach is still ongoing when the last breaching measurement is at most this old (reminders).
    ongoing-breach-window: 5m
    notifications:
      poll-interval: 5s
      reminder-check-interval: 60s
      retry-for: 30m
      initial-backoff: 30s
      max-backoff: 5m
